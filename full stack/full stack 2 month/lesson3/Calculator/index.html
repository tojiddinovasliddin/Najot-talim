<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="./index.css">
</head>
<body>
<div class="container">

<h2 class="input"></h2>


<table class="table">
    <tr>
        <th><button onclick="delet()" style="background-color: #545151;">⌫</button></th>
        <th><button onclick="clears()"style="background-color: #545151;">C</button></th>
        <th><button style="background-color: #545151;">%</button></th>
        <th><button onclick="devide()" style="background-color: #ff9500" >÷</button></th>
    </tr>
    <tr>
        <th><button onclick="seven()">7</button></th>
        <th><button onclick="eight()">8</button></th>
        <th><button onclick="night()">9</button></th>
        <th><button onclick="multly()" style="background-color: #ff9500">X</button></th>
    </tr>
    <tr>
        <th><button onclick="four()">4</button></th>
        <th><button onclick="five()">5</button></th>
        <th><button onclick="six()">6</button></th>
        <th><button onclick="minus()" style="background-color: #ff9500">-</button></th>
    </tr>
    <tr>
        <th><button onclick="one()">1</button></th>
        <th><button onclick="two()">2</button></th>
        <th><button onclick="three()">3</button></th>
        <th><button onclick="add()" style="background-color: #ff9500">+</button></th>
    </tr>
    <tr>
        <th><button onclick ="modul()">+/−</button></th>
        <th><button onclick="zero()">0</button></th>
        <th><button onclick="comma()">,</button></th>
        <th><button onclick="result()" style="background-color: #ff9500">=</button></th>
    </tr>
</table>


</div>
<script src="./index.js"></script>
</body>
</html>
