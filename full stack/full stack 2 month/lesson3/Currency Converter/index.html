<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="./index.css">
    <link rel="shortcut icon" href="./images/icon.png" type="image/x-icon">
</head>
<body>
<div class = "container">
<div class="box">
<div class="title">
    <img src="./images/image.png" alt="">
    <h3>Currency Converter</h3>
</div>

<div class="amount">
    <input class ="input" type="number" placeholder="enter amount">
<div class="selects">
    <div class="from">
        <h3 class = "form">From</h3>
        <select id="money1">
            <option>USD</option>
            <option>EUR</option>
            <option>RUB</option>
            <option>UZS</option>
        </select>

    </div>
    <img src="./images/exchange.png" alt="">
    <div class="to">
        <h3 class="too">To</h3>
        <select id="money2">
            <option>USD</option>
            <option>EUR</option>
            <option>RUB</option>
            <option>UZS</option>
        </select>
    </div>
</div>
    <img src="./images/canver.jpeg" alt="">

    <button onclick="change()">
        <img src="images/button_convert.png" alt="">
        Convert</button>

<div class="box1">
<h2 class ="input_money">100 USD</h2>
<img src="./images/arrow-left.png" alt="">
<h2 class="output_money">100 USD</h2>
</div>
</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="index.js"></script>
</body>
</html>
